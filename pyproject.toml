[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asvd"
version = "0.1.0"
description = "Activation-calibrated low-rank compression for PyTorch models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
promptcir = ["timm", "einops", "numpy", "Pillow>=9.1"]

[tool.setuptools.packages.find]
include = ["asvd*"]
